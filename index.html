/* ===================== CORE: chuẩn hoá, tìm kiếm, giờ mở cửa ===================== */
const TONE_G=/[\u0300\u0301\u0303\u0309\u0323]/g;
const stripAll=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
const nfc=s=>String(s).normalize("NFC").toLowerCase();
/* Token: {raw, nz (không dấu), base (giữ â,ê,ô,ơ,ư,ă,đ nhưng bỏ dấu thanh), tone (dấu thanh), ascii} */
function mkTok(raw){const d=raw.normalize("NFD");return{raw,nz:stripAll(raw),base:d.replace(TONE_G,"").normalize("NFC"),tone:(d.match(TONE_G)||[]).join(""),ascii:/^[\x00-\x7f]+$/.test(raw)}}
const tok=s=>(nfc(s).match(/[\p{L}\p{N}~]+/gu)||[]).map(mkTok);
/* So khớp từ: gõ KHÔNG dấu → khớp mọi dấu; gõ CÓ dấu → phải đúng dấu thanh và dấu mũ ("phở" ≠ "phố", "thủy" = "thuỷ"). */
function tokEq(q,w,pref){
  if(q.ascii?q.nz===w.nz:(q.base===w.base&&q.tone===w.tone))return true;
  if(pref&&q.nz.length>=4&&!q.raw.includes("~")){return q.ascii?w.nz.startsWith(q.nz):(w.base.startsWith(q.base)&&(!q.tone||q.tone===w.tone))}
  return false}
function phrase(arr,qt,pref){const n=qt.length;for(let i=0;i+n<=arr.length;i++){let ok=true;for(let j=0;j<n&&ok;j++)ok=tokEq(qt[j],arr[i+j],pref&&j===n-1);if(ok)return true}return false}
const allIn=(arr,qt,pref)=>qt.every((q,j)=>arr.some(w=>tokEq(q,w,pref&&j===qt.length-1)));

/* Từ chung chung trong tên quán: bỏ ra khỏi "tên lõi" để gõ "pho" không bị khớp nhầm "Hẻm PHỐ Quán". */
const GENERIC=new Set("quán tiệm nhà hàng ăn hẻm phố ẩm thực sân vườn và quận kdl".split(" "));

/* Cụm món ghép (một món, không tách): "phở cuốn" ≠ "phở". Lấy tự động từ các tag có dấu ~ */
let GLUE=[];
function buildGlue(){const s=new Set();DATA.forEach(x=>x.t.forEach(t=>t.split(/\s+/).forEach(w=>{if(w.includes("~"))s.add(w)})));GLUE=[...s].map(g=>({tok:mkTok(g),parts:g.split("~").map(p=>mkTok(p))}))}
function mergeGlue(qt){const out=[];for(let i=0;i<qt.length;i++){let g=null;for(const c of GLUE){const n=c.parts.length;if(i+n<=qt.length&&c.parts.every((p,j)=>tokEq(qt[i+j],p))){g=c;break}}
  if(g){const n=g.parts.length,asc=qt.slice(i,i+n).every(t=>t.ascii);out.push({...g.tok,ascii:asc});i+=n-1}else out.push(qt[i])}return out}

function indexPlace(x){x.nameT=tok(x.n);x.coreT=x.nameT.filter(w=>!GENERIC.has(w.raw));x.tagT=x.t.map(tok);x.allT=[...x.coreT,...x.tagT.flat()];x.addrT=tok(x.ad);x.S=parseSched(x.hs)}

/* Điểm khớp. 0 = KHÔNG khớp (loại hẳn, không "gợi ý bừa"). */
function scoreQ(x,qt,pref){
  if(!qt.length)return{s:1,why:""};
  if(phrase(x.coreT,qt,pref))return{s:100,why:"name"};
  const tg=x.tagT.findIndex(a=>phrase(a,qt,pref));if(tg>=0)return{s:90,why:"tag",tag:x.t[tg]};
  if(qt.length>1){if(allIn(x.coreT,qt,pref))return{s:85,why:"name"};
    const t2=x.tagT.findIndex(a=>allIn(a,qt,pref));if(t2>=0)return{s:70,why:"tag",tag:x.t[t2]};
  }
  if((qt.length>1||!qt[0].ascii)&&phrase(x.nameT,qt,pref))return{s:60,why:"name"};
  if(qt.length>1&&phrase(x.addrT,qt,false))return{s:20,why:"addr"};
  return{s:0}}

/* ===================== Hiểu câu hỏi ===================== */
const EN={"broken rice":"cơm tấm","hot pot":"lẩu","hotpot":"lẩu","sweet soup":"chè","dessert":"chè","snails":"ốc","snail":"ốc","grilled":"nướng","grill":"nướng","beef noodle":"bún bò","crab":"cua","beef":"bò","chicken":"gà","pork":"heo","frog":"ếch","seafood":"hải sản","dumplings":"sủi cảo","dumpling":"sủi cảo","duck":"vịt","eel":"lươn","shrimp":"tôm","porridge":"cháo","spring rolls":"gỏi cuốn","rice":"cơm","fish":"cá"};
const EN_RE=new RegExp("(?<![\\p{L}\\p{N}])("+Object.keys(EN).sort((a,b)=>b.length-a.length).join("|")+")(?![\\p{L}\\p{N}])","gu");
const NOTL="(?<![\\p{L}\\p{N}])",NOTR="(?![\\p{L}\\p{N}])";
const RX=(src)=>new RegExp(NOTL+"(?:"+src+")"+NOTR,"giu");
const STOP=new Set("tôi toi muốn muon cần can tìm tim kiếm kiem ăn an uống uong gần gan ở o tại tai khu vực vuc quận quan district dist near i want to eat the a in for some good best ngon nhất nhat món mon nào nao cho nhé nhe đi di giúp giup gợi goi ý một mot vài vai là la và va gì gi quanh đây day tp q".split(" "));
const AREAS=[["thu duc","Quận Thủ Đức"],["tan binh","Quận Tân Bình"],["tan phu","Quận Tân Phú"],["binh tan","Quận Bình Tân"],["binh thanh","Quận Bình Thạnh"],["go vap","Quận Gò Vấp"],["phu nhuan","Quận Phú Nhuận"]];
const MEALW={morning:[5,10],noon:[10,14],afternoon:[14,18],evening:[18,24]};

function parseQuery(text,known){
  let w=nfc(text).replace(EN_RE,m=>EN[m]);
  w=w.replace(/hủ tíu/g,"hủ tiếu").replace(/hu tiu/g,"hu tieu").replace(/mỳ(?![\p{L}])/gu,"mì");
  const I={area:null,areaMiss:null,open:false,maxP:null,minP:null,meal:null,near:false,cat:null};
  const cut=(re,fn)=>{w=w.replace(re,(...a)=>{fn&&fn(a);return " "})};
  /* khu vực: "quận 5", "q.5", "district 5" — số phải trọn vẹn (quận 1 ≠ quận 10) */
  cut(RX("(?:quận|quan|q\\.?|district|dist\\.?)\\s*(\\d{1,2})"),a=>{const n=+a[1],k="Quận "+n;if(known.has(k))I.area=k;else I.areaMiss=k});
  if(!I.area&&!I.areaMiss){const z=stripAll(w);if(z.length===w.length){for(const[p,name]of AREAS){const m=new RegExp("(?:^|[^a-z0-9])(?:q\\.?\\s*|quan\\s+)?(?:tp\\.?\\s*)?("+p+")(?![a-z0-9])").exec(z);if(m){const s=m.index+m[0].indexOf(m[1]);w=w.slice(0,s)+" ".repeat(p.length)+w.slice(s+p.length);I.area=name;break}}}}
  cut(RX("gần tôi|gần đây|gần mình|quanh đây|gan toi|gan day|near me|nearby|nearest"),()=>I.near=true);
  cut(RX("đang mở cửa|đang mở|dang mo cua|dang mo|mở cửa|mo cua|open now|opening now|bây giờ|bay gio|giờ này|gio nay"),()=>I.open=true);
  cut(RX("(?:dưới|duoi|under|<)\\s*(\\d{2,3})\\s*(?:k|nghìn|nghin|ngàn|ngan)"),a=>I.maxP=+a[1]*1000);
  cut(RX("(?:dưới|duoi|under|<)\\s*(\\d{2,3})[.,]000\\s*(?:đ|d|vnd|đồng|dong)?"),a=>I.maxP=+a[1]*1000);
  cut(RX("(?:trên|tren|over|above|>)\\s*(\\d{2,3})\\s*(?:k|nghìn|nghin|ngàn|ngan)"),a=>I.minP=+a[1]*1000);
  cut(RX("giá rẻ|gia re|rẻ|bình dân|binh dan|cheap"),()=>{if(I.maxP==null)I.maxP=50000});
  cut(RX("(?:buổi|buoi|ăn|an|bữa|bua)\\s+(sáng|sang|trưa|trua|chiều|chieu|tối|toi|khuya)"),a=>{const k=stripAll(a[1]);I.meal={sang:"morning",trua:"noon",chieu:"afternoon",toi:"evening",khuya:"evening"}[k]});
  cut(RX("ăn vặt|an vat|snack"),()=>I.cat="snack");
  cut(RX("tráng miệng|trang mieng|đồ ngọt|do ngot"),()=>I.cat="sweet");
  let qt=tok(w).filter(t=>!STOP.has(t.raw));
  I.qt=mergeGlue(qt);I.qs=I.qt.map(t=>t.raw.replace(/~/g," ")).join(" ");
  return I}

/* ===================== Giờ mở cửa ===================== */
function parseSched(s){if(!s)return null;const days=Array.from({length:7},()=>[]);
  s.split("|").forEach(g=>{let ds=[0,1,2,3,4,5,6],body=g;const at=g.indexOf("@");
    if(at>=0){ds=[];g.slice(0,at).split(",").forEach(p=>{const m=p.match(/^(\d)(?:-(\d))?$/);if(m){const a=+m[1],b=m[2]!=null?+m[2]:a;for(let d=a;d<=b;d++)ds.push(d)}});body=g.slice(at+1)}
    body.split(",").forEach(iv=>{const m=iv.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);if(m){const s0=+m[1]+m[2]/60;let e0=+m[3]+m[4]/60;if(e0<=s0)e0+=24;ds.forEach(d=>days[d].push([s0,e0]))}})});
  return days}
function vnNow(){try{const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Ho_Chi_Minh",weekday:"short",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date()),g=t=>p.find(o=>o.type===t).value;
  return{d:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),h:+g("hour")+ +g("minute")/60}}catch(e){const n=new Date();return{d:n.getDay(),h:n.getHours()+n.getMinutes()/60}}}
/* true/false nếu biết giờ; null nếu tài liệu không có giờ cụ thể */
function isOpen(x,now){if(!x.S)return null;now=now||vnNow();
  return x.S[now.d].some(([s,e])=>now.h>=s&&now.h<e)||x.S[(now.d+6)%7].some(([s,e])=>e>24&&now.h<e-24)}
function opensIn(x,[a,b],now){if(!x.S)return false;now=now||vnNow();
  return x.S[now.d].some(([s,e])=>s<b&&Math.min(e,24)>a)||(a<6&&x.S[(now.d+6)%7].some(([s,e])=>e>24&&e-24>a))}

/* ===================== Tìm kiếm ===================== */
const priceOK=(x,I)=>{if(I.maxP==null&&I.minP==null)return true;if(!x.p)return false;return(I.maxP==null||x.p[1]<=I.maxP)&&(I.minP==null||x.p[0]>=I.minP)};
function runSearch(I,opt){opt=opt||{};const now=vnNow();
  const rows=[];for(const x of DATA){
    if(opt.area&&x.a!==opt.area)continue;
    if(I.cat&&x.c!==I.cat)continue;
    if(!priceOK(x,I))continue;
    if(I.open&&isOpen(x,now)!==true)continue;
    if(I.meal&&!opensIn(x,MEALW[I.meal],now))continue;
    const r=scoreQ(x,opt.qt||I.qt,!!opt.pref);if(r.s<=0)continue;
    rows.push({x,...r})}
  return rows}

function effective(){const I=parseQuery($("q").value,KNOWN),E={...I,area:I.area||$("d").value||null},pv=$("p").value;
  if(pv==="1")E.maxP=Math.min(E.maxP??1e12,50000);if(pv==="2")E.maxP=Math.min(E.maxP??1e12,100000);if(pv==="3")E.minP=Math.max(E.minP??0,100000);
  if($("o").checked)E.open=true;if($("s").value==="d")E.near=true;return E}
function sortRows(rows,E,hasQ){const nm=(p,q)=>p.x.n.localeCompare(q.x.n,"vi");
  return rows.sort((p,q)=>(E.near&&me?p.x.dist-q.x.dist:0)||(hasQ?q.s-p.s:0)||nm(p,q))}
function updateDistances(){DATA.forEach(x=>{x.dist=me?dist(me,x.pos):null})}
function setMe(pos,label,focusFirst){
  me=pos;meLabel=label||t("locGpsOk");locBusy=false;$("s").value="d";shown=12;
  updateDistances();render();

  if(focusFirst&&rows.length){selId=rows[0].x.id;updateGmapEmbed();
    document.querySelectorAll(".mi").forEach(b=>b.classList.toggle("on",+b.dataset.mf===selId))}
}
function fallbackLoc(showMsg){
  locBusy=false;
  const area=$("d").value;
  if(area&&C[area]){setMe([...C[area]],t("area")(area),true)}
  else if(!me){const d0=LANDMARKS[0];setMe([...d0.pos],lang==="en"?d0.en:d0.vi,true)}
  else{render()}
  if(showMsg)showToast(t("nearErr"));
}
function requestLoc(forceGps){
  if(locBusy)return;
  if(!navigator.geolocation){fallbackLoc(true);return}
  locBusy=true;renderLocBar();
  const onOk=p=>{locBusy=false;$("loc-preset").value="";setMe([p.coords.latitude,p.coords.longitude],`${t("locGpsOk")} (${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)})`,true)};
  const onErr=()=>{navigator.geolocation.getCurrentPosition(onOk,()=>fallbackLoc(true),{enableHighAccuracy:false,timeout:6000,maximumAge:300000})};
  navigator.geolocation.getCurrentPosition(onOk,onErr,{enableHighAccuracy:true,timeout:5000,maximumAge:forceGps?0:60000});
}
function renderLocBar(){
  const E=effective(),on=E.near||me!=null||pickMapMode;
  $("locbar").classList.toggle("on",on);
  $("near").setAttribute("aria-pressed",E.near?"true":"false");
  if(!on)return;
  $("loc-status").innerHTML=locBusy?t("locWait"):t("locCur")(esc(meLabel||t("locGpsOk")));

}

  sel.innerHTML=`<option value="">${t("locPresetPh")}</option><optgroup label="${lang==="en"?"Popular landmarks":"Địa điểm phổ biến"}">${lmOpts}</optgroup><optgroup label="${lang==="en"?"District centers":"Trung tâm Quận"}">${arOpts}</optgroup>`;
  sel.value=cur;

function listRows(){const E=effective();updateDistances();
  let rows=E.areaMiss?[]:runSearch(E,{area:E.area,qt:E.qt,pref:true});if(ctx)rows=rows.filter(r=>r.x.ctx[ctx.k]);
  return{E,rows:sortRows(rows,E,E.qt.length>0)}}
function describe(E){const p=[];if(E.qs)p.push(`${t("iDish")}: “${esc(E.qs)}”`);if(E.area||E.areaMiss)p.push(esc(t("area")(E.area||E.areaMiss)));if(E.cat)p.push(t("iCat")[E.cat]);if(E.meal)p.push(t("iMeal")[E.meal]);if(E.open)p.push(t("iOpen"));
  if(E.maxP!=null)p.push(t("iMaxP")(money(E.maxP)+"đ"));if(E.minP!=null)p.push(t("iMinP")(money(E.minP)+"đ"));if(E.near)p.push(t("iNear")+(meLabel?` (${esc(meLabel)})`:""));return p}
function render(){const{E,rows}=listRows();if(E.near&&!me&&!locBusy)requestLoc(false);
  renderLocBar();
  $("count").textContent=t("cnt")(rows.length);
  const d=describe(E);$("interp").innerHTML=(E.qt.length||d.length>(E.qs?1:0))&&d.length?`${t("iFor")}: ${d.map(s=>`<span class="ichip">${s}</span>`).join(" ")}`:"";
  $("notice-miss").textContent=E.areaMiss?t("aiAreaMiss")(E.areaMiss):"";
  const isNear=E.near&&me!=null;
  $("grid").innerHTML=rows.length?rows.slice(0,shown).map((r,i)=>card(r.x,r.s>1?whyOf(r):"",isNear&&i===0)).join(""):`<div class="empty">${t("none")}</div>`;
  $("more").style.display=rows.length>shown?"":"none";mapUpdate(rows.map(r=>r.x));renderMeal()}
function i18n(){document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v==="string")e.textContent=v});
  $("src").textContent=t("src")(DATA.length);
  const cur=$("d").value;$("d").innerHTML=`<option value="">—</option>`+AREA_LIST.map(a=>`<option value="${esc(a)}">${esc(t("area")(a))}</option>`).join("");$("d").value=cur;
  const pc=$("p").value;$("p").innerHTML=`<option value="0">—</option><option value="1">${t("p1")}</option><option value="2">${t("p2")}</option><option value="3">${t("p3")}</option>`;$("p").value=pc;
  const sc=$("s").value;$("s").innerHTML=`<option value="n">${t("s1")}</option><option value="d">${t("s3")}</option>`;$("s").value=sc;populateLocPresets();
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("q").placeholder=lang==="vi"?"phở, ốc, bún bò quận 5…":"pho, snails, bún bò district 5…";$("aiq").placeholder=lang==="vi"?"Tôi muốn ăn bún bò gần Bình Tân":"I want bún bò near Binh Tan";
  $("aiout").innerHTML="";setTiles();renderCtx();render();if(curId&&$("dlg").open)fillDetail(curId)}

/* ---------- gợi ý (hộp “Bạn đang thèm món gì?”) ---------- */
function ask(){const raw=$("aiq").value.trim();if(!raw){showToast(t("aiEmpty"));return}
  const I=parseQuery(raw,KNOWN);if(I.near&&!me&&!locBusy)requestLoc(false);updateDistances();
  const note=`<div class="notice">${t("aiNote")}</div>`,head=(extra)=>{const d=describe(I);return `<p class="interp">${t("iFor")}: ${d.map(s=>`<span class="ichip">${s}</span>`).join(" ")||"—"}</p>${extra?`<p>${extra}</p>`:""}`};
  const out=h=>{$("aiout").innerHTML=note+h};
  if(I.areaMiss){out(head()+`<div class="empty">${t("aiAreaMiss")(I.areaMiss)}</div>`);return}
  const nothing=!I.qt.length&&!I.area&&!I.cat&&!I.meal&&!I.open&&I.maxP==null&&I.minP==null&&!I.near;
  if(nothing){out(`<div class="empty">${t("aiNone")}</div>`);return}
  let rows=runSearch(I,{area:I.area,qt:I.qt,pref:false}),msg="";
  if(!rows.length&&I.area&&I.qt.length){const alt=runSearch(I,{area:null,qt:I.qt,pref:false});if(alt.length){rows=alt;msg=t("aiElsewhere")(I.qs,t("area")(I.area))}}
  if(!rows.length&&I.qt.length>1){const tries=[I.qt.slice(0,-1),I.qt.slice(1)];for(const q of tries){const alt=runSearch(I,{area:I.area,qt:q,pref:false});if(alt.length){rows=alt;msg=t("aiRelaxed")(I.qs,q.map(z=>z.raw.replace(/~/g," ")).join(" "));break}}}
  if(!rows.length){out(head()+`<div class="empty">${t("aiNone")}</div>`);return}
  sortRows(rows,I,I.qt.length>0);const top=rows.slice(0,6);
  out(head(msg)+`<p class="meta" style="color:inherit">${t("aiShown")(top.length,rows.length)}</p><div class="grid">${top.map(r=>card(r.x,whyOf(r))).join("")}</div>`+(rows.length>6&&!msg?`<p><button class="btn" style="background:var(--gold);color:#252722" data-seeall>${t("seeAll")(rows.length)}</button></p>`:""))}

/* ---------- chi tiết ---------- */
function fillDetail(id){const x=DATA.find(o=>o.id===id);if(!x)return;
  $("dbody").innerHTML=`<div class="dhero" aria-hidden="true">${x.icon}</div><h2>${esc(x.n)}</h2><p class="meta">${esc(t("area")(x.a))}</p><div class="meta">📍 ${esc(x.ad)}</div>
<p><b>${t("price")}:</b> ${priceTxt(x)}<br><b>${t("hours")}:</b> ${esc(x.h||t("noHours"))}${badge(x)}${x.x?`<br><b>${t("crowd")}:</b> ${esc(x.x)}`:""}</p>
${x.d?`<h3>${t("about")}</h3><p>${esc(x.d)}</p>`:""}${x.t.length?`<h3>${t("best")}</h3><ul>${x.t.map(s=>`<li>${esc(s.replace(/~/g," "))}</li>`).join("")}</ul>`:""}
<div class="dmap"><iframe src="${gmapEmbedSrc(x,false)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="Google Maps - ${esc(x.n)}"></iframe></div>
<div class="row"><button data-dir="${id}">🧭 ${t("dir")}</button><button data-map="${id}">📍 ${t("onmap")}</button><a href="${esc(gLink(x))}" target="_blank" rel="noopener">↗ ${t("gmaps")}</a><button data-close>${t("close")}</button></div>`}
function openDetail(id){curId=id;fillDetail(id);if(!$("dlg").open)$("dlg").showModal()}

/* ---------- ngữ cảnh thời tiết ---------- */
function renderCtx(){const ks=[...(W.rain?["rain"]:[]),...(W.hot?["hot"]:[])];
  $("ctx").innerHTML=ks.length?`<p style="margin:0">${t("ctxH")(W.tmp)}</p><div class="chips">${ks.map(k=>`<button class="chip" data-ctx="${k}" aria-pressed="${!!ctx&&ctx.k===k}">${t("c_"+k)}</button>`).join("")}</div>`:""}
async function initCtx(){try{const j=(await(await fetch("https://api.open-meteo.com/v1/forecast?latitude=10.78&longitude=106.70&current=temperature_2m,precipitation,weather_code")).json()).current;
  W={tmp:Math.round(j.temperature_2m),rain:j.precipitation>0||(j.weather_code>=51&&j.weather_code<=67)||j.weather_code>=80,hot:j.temperature_2m>=33};renderCtx()}catch(e){}}

/* ---------- theo buổi ---------- */
const nowMeal=()=>{const h=vnNow().h;return h>=5&&h<10?"morning":h>=10&&h<14?"noon":h>=14&&h<18?"afternoon":"evening"};
let meal=nowMeal();
function renderMeal(){const nm=nowMeal(),now=vnNow();
  $("mtabs").innerHTML=Object.keys(MEALW).map(k=>`<button class="chip" data-meal="${k}" aria-pressed="${k===meal}">${t("m_"+k)}${k===nm?t("now"):""}</button>`).join("");
  const r=DATA.filter(x=>MEAL_CATS[meal].includes(x.c)&&opensIn(x,MEALW[meal],now)).sort((p,q)=>(meal===nm?(isOpen(q,now)===true)-(isOpen(p,now)===true):0)||p.n.localeCompare(q.n,"vi"));
  $("mgrid").innerHTML=r.length?r.slice(0,mealShown).map(x=>card(x,`${t("mealWhy")} ${esc(x.h)}`)).join(""):`<div class="empty">${t("none")}</div>`;
  $("mmore").style.display=r.length>mealShown?"":"none"}

/* ---------- sự kiện ---------- */
document.addEventListener("click",e=>{const g=s=>e.target.closest(s);
  const l=g("[data-l]");if(l){lang=l.dataset.l;try{localStorage.setItem("fm_lang",lang)}catch(x){}i18n();return}
  const im=g("[data-inline-map]");if(im){const id=+im.dataset.inlineMap;inlineMapIds.has(id)?inlineMapIds.delete(id):inlineMapIds.add(id);render();return}
  const dr=g("[data-dir]");if(dr){$("dlg").close();focusMap(+dr.dataset.dir,false,true);return}
  const gd=g("[data-gdir]");if(gd){gdirMode=!gdirMode;if(gdirMode&&!me&&navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.latitude,p.coords.longitude];updateGmapEmbed()},()=>updateGmapEmbed(),{timeout:6000})}updateGmapEmbed();return}
  if(g("[data-garea]")){selId=null;gdirMode=false;document.querySelectorAll(".mi").forEach(b=>b.classList.remove("on"));updateGmapEmbed();return}
  const mp=g("[data-map]");if(mp){$("dlg").close();focusMap(+mp.dataset.map,false,false);return}
  const dt=g("[data-detail]");if(dt){openDetail(+dt.dataset.detail);return}
  if(g("[data-close]")){$("dlg").close();return}
  const th=g("[data-th]");if(th){setTheme(th.dataset.th,true);return}
  const mf=g("[data-mf]");if(mf){focusMap(+mf.dataset.mf,true,false);return}
  const mt=g("[data-meal]");if(mt){meal=mt.dataset.meal;mealShown=6;renderMeal();return}
  const cx=g("[data-ctx]");if(cx){const k=cx.dataset.ctx;ctx=ctx&&ctx.k===k?null:{k};shown=12;renderCtx();render();if(ctx)$("kham-pha").scrollIntoView({behavior:"smooth"});return}
  if(g("[data-seeall]")){$("q").value=$("aiq").value;$("d").value="";$("p").value="0";$("o").checked=false;$("s").value="n";shown=12;render();$("kham-pha").scrollIntoView({behavior:"smooth"});return}
  const c=g("[data-d]");if(c&&!g("a,button,iframe"))openDetail(+c.dataset.d)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".card[data-d]"))openDetail(+e.target.dataset.d)});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
let rt;["q","d","p","s","o"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",()=>{shown=12;clearTimeout(rt);rt=setTimeout(render,id==="q"?120:0)}));
$("clr").addEventListener("click",()=>{$("q").value="";$("d").value="";$("p").value="0";$("s").value="n";$("o").checked=false;ctx=null;me=null;meLabel="";pickMapMode=false;shown=12;updateDistances();renderCtx();render()});
$("more").onclick=()=>{shown+=12;render()};$("mmore").onclick=()=>{mealShown+=6;renderMeal()};
$("near").onclick=()=>{
  $("s").value="d";shown=12;
  if(me){render();const{rows}=listRows();if(rows.length){selId=rows[0].x.id;updateGmapEmbed()}$("locbar").scrollIntoView({behavior:"smooth",block:"nearest"})}
  else{requestLoc(true)}
};
$("loc-gps").onclick=()=>requestLoc(true);
$("loc-preset").onchange=e=>{
  const v=e.target.value;if(!v)return;
  if(v.startsWith("lm:")){const id=v.slice(3),l=LANDMARKS.find(o=>o.id===id);if(l){$("d").value="";setMe([...l.pos],lang==="en"?l.en:l.vi,true)}}
  else if(v.startsWith("ar:")){const a=v.slice(3);if(C[a]){setMe([...C[a]],t("area")(a),true)}}
};
$("loc-pick").onclick=()=>{
  pickMapMode=!pickMapMode;
  if(pickMapMode){gmode="pins";lyrLbl();if(map)setTimeout(()=>map.invalidateSize(),80);$("mapbox").scrollIntoView({behavior:"smooth",block:"center"})}
  renderLocBar();
};
$("loc-off").onclick=()=>{me=null;meLabel="";pickMapMode=false;if($("s").value==="d")$("s").value="n";updateDistances();render()};
$("aigo").onclick=ask;$("aiq").addEventListener("keydown",e=>{if(e.key==="Enter")ask()});
$("roll").onclick=()=>{const f=listRows().rows.map(r=>r.x),a=f.length?f:DATA,o=$("aiout"),end=Date.now()+1400,b=$("roll");b.disabled=true;
  const iv=setInterval(()=>{if(Date.now()>end){clearInterval(iv);b.disabled=false;o.innerHTML=`<div class="grid">${card(a[Math.floor(Math.random()*a.length)],t("rollWhy"))}</div>`}else o.innerHTML=`<div class="notice">🎲 ${esc(a[Math.floor(Math.random()*a.length)].n)}</div>`},80)};

/* ---------- giao diện sáng/tối ---------- */
function setTheme(m,keep){document.documentElement.dataset.theme=m;document.querySelectorAll("[data-th]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.th===m));if(keep)try{localStorage.setItem("fm_theme",m)}catch(e){}if(typeof setTiles==="function"&&$("mapbox"))setTiles()}
let _th=null;try{_th=localStorage.getItem("fm_theme")}catch(e){}
setTheme(_th||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
initMap();i18n();initCtx();

</script>
</body>
</html>
